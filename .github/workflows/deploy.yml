name: Deploiement du site
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
