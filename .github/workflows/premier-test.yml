name: Verification de mon site
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Verifier index.html
        run: test -f index.html
      - name: Verifier le titre du site
        run: grep -q "<title>" index.html
      - name: Afficher le resultat
        run: echo "Tous les tests sont reussis !"
